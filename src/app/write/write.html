<section class="view write" (click)="refocus($event)">
  <div class="bar">
    <span class="tabular" role="timer">{{ clock() }}</span>
    @if (prompt(); as word) {
      @if (started()) {
        <span class="prompt">{{ word }}</span>
      } @else {
        <button
          class="prompt"
          type="button"
          title="Another word"
          aria-label="{{ word }}. Choose another word"
          (click)="anotherPrompt()"
        >
          {{ word }} <span class="again" aria-hidden="true">↻</span>
        </button>
      }
    }
    <span class="tabular page-count">page {{ pageNumber() }}</span>
  </div>
  <div class="progress" [style.--left]="left()"><span></span></div>
  <div
    #sheet
    class="sheet"
    [class.burning]="burning()"
    [style.--heat]="heat()"
    [style.--sheets]="(pageNumber() - 1 > 6 ? 6 : pageNumber() - 1) * 2"
  >
    <textarea
      #page
      class="page-input"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      autocomplete="off"
      aria-label="Your page"
      (keydown)="onKeydown($event)"
      (beforeinput)="onBeforeInput($event)"
      (input)="onInput($event)"
      (compositionend)="onCompositionEnd()"
      (paste)="blockTransfer($event)"
      (drop)="blockTransfer($event)"
      (cut)="blockTransfer($event)"
      (click)="pinCaret()"
      (select)="pinCaret()"
      (mouseup)="pinCaret()"
      (touchend)="pinCaret()"
    ></textarea>
    <app-fire aria-hidden="true" [heat]="burning() ? 1.15 : heat()" />
  </div>
  <p class="hint">{{ hint() }}</p>
  <button class="link quiet" type="button" (click)="giveUp()">Give up</button>
</section>
